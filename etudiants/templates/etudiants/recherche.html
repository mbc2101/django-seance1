<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Recherche d'étudiants</title>
</head>
<body>
    <h1>Résultats de la recherche pour "{{ query }}"</h1>

    {% if etudiants %}
        <ul>
            {% for etudiant in etudiants %}
                <li>
                    <a href="{% url 'etudiants:detail' etudiant.id %}">
                        {{ etudiant.nom }}
                    </a> - Moyenne : {{ etudiant.moyenne }}
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>Aucun étudiant trouvé pour "{{ query }}".</p>
    {% endif %}

    <p>
        <a href="{% url 'etudiants:liste' %}">← Retour à la liste des étudiants</a>
    </p>
</body>
</html>
